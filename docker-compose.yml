services:
  db:
    image: postgres:16-alpine
    container_name: sanbao_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sanbao_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sanbao_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-sanbao_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_schemas.sql:/docker-entrypoint-initdb.d/init_schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sanbao_admin} -d ${POSTGRES_DB:-sanbao_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sanbao_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-sanbao_admin}:${POSTGRES_PASSWORD:-sanbao_secure_password_2026}@db:5432/${POSTGRES_DB:-sanbao_db}
      - SECRET_KEY=${SECRET_KEY:-san_bao_super_secret_development_key_change_in_production_9988776655}
      - ENVIRONMENT=development
      - DEBUG=True
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sanbao_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
